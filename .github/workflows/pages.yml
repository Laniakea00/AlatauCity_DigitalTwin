# Publishes the WebGL build of the twin on GitHub Pages.
# The build is not stored in git (hundreds of MB): Unity → Alatau City → Build WebGL makes UnityProject/Builds/alatau-webgl.zip,
# it is attached to a GitHub Release, and this workflow unpacks it and deploys it.
# Run: publish a Release with the asset alatau-webgl.zip, or Actions → "Publish WebGL to Pages" → Run workflow (takes the latest release).
name: Publish WebGL to Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the build from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p alatau-webgl.zip
          else gh release download -R "$GITHUB_REPOSITORY" -p alatau-webgl.zip; fi
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("alatau-webgl.zip") as z:
              for i in z.infolist():
                  name = i.filename.replace("\\", "/")          # archives made on Windows may use backslashes
                  if name.endswith("/"): continue
                  out = os.path.join("site", name); os.makedirs(os.path.dirname(out), exist_ok=True)
                  with z.open(i) as src, open(out, "wb") as dst: dst.write(src.read())
          PY
          touch site/.nojekyll
          du -sh site; ls -la site site/Build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
